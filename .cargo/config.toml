# Link the Visual C++ runtime into patina.exe rather than beside it.
#
# Rust's MSVC target links vcruntime140.dll, vcruntime140_1.dll and
# msvcp140.dll dynamically. GitHub's Windows runners have the Visual C++
# redistributable installed, so a build there runs there, and the same exe
# exits at once on a machine without it, with 0xC0000135
# (STATUS_DLL_NOT_FOUND) and no window or message. Patina's Windows folder
# should run as it is unpacked, so the runtime goes inside the exe.
#
# Here rather than in a workflow so that CI tests the exe the way it ships.
# packaging/windows-imports.ps1 checks the result, in ci.yml and release.yml.
#
# Nothing else belongs in this file: anything naming a path on one machine
# (build.target-dir above all) breaks every other contributor.

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
