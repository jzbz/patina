# Formatting, lints, a build and the whole test suite on Linux, macOS and
# Windows.
#
# Until this workflow Patina had only ever run on a Linux desktop. macOS and
# Windows were known to compile, through `cargo clippy --target`, which proves
# nothing about linking and less about behaviour. Each job here builds natively
# and runs the tests against a real libmpv and ffmpeg.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request makes its check pointless, so it replaces
# it. Each push to master gets a group of its own instead, so every commit
# there gets a result, and the runs that save the caches every other run
# starts from are never cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

# Read-only, and written here rather than left to the repository's default,
# which can change without this file changing. The jobs run the build scripts
# of every dependency and all of the test code, and nothing they do needs to
# write. For the same reason the checkout leaves no credential on disk.
#
# Actions are pinned by commit SHA, not by tag: a tag is mutable, so whoever
# controls the action's repository could change what runs here after the
# fact. Dependabot keeps the SHAs current (.github/dependabot.yml).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Both for the size of each job's cache, all of which has to fit in the
  # repository's 10 GB. Incremental state only speeds up rebuilding Patina
  # itself against the run that saved it; line tables still give a backtrace
  # a file and line for each frame.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # The tests that need libmpv or ffmpeg skip when either is missing, which is
  # a convenience on a developer's machine and here would be a green run that
  # tested no playback code at all. Set to 1, they fail instead.
  PATINA_TEST_REQUIRE_MPV: "1"
  PATINA_TEST_REQUIRE_FFMPEG: "1"

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Well above a cold build on the slowest runner. A run still going at an
    # hour is wedged, not busy; GitHub's own ceiling is six.
    timeout-minutes: 60
    strategy:
      # One platform failing should not hide what the others would have said.
      fail-fast: false
      matrix:
        # ubuntu-26.04 rather than ubuntu-latest: the label is moving from
        # 24.04 to 26.04 until 2026-11-19, and 24.04's libmpv (mpv 0.37) is
        # older than Patina supports, so the floating label would test a
        # different mpv from one run to the next. 26.04 ships mpv 0.41.
        os: [ubuntu-26.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the compiler, which the images don't ship
      # under that name, so this installs it with the file's components.
      # --no-self-update keeps rustup itself as the image has it.
      #
      # The version goes into the cache key below: cargo rebuilds what another
      # rustc compiled rather than reuse it. `shell: bash` brings pipefail.
      - name: Toolchain
        id: toolchain
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustc -Vv
          v=$(rustc -V | tr -cs '[:alnum:].' '-')
          echo "rustc=${v%-}" >> "$GITHUB_OUTPUT"

      # fontconfig is the one library the build needs: Slint finds fonts with
      # it, and yeslogic-fontconfig-sys's build script fails the build if
      # pkg-config can't find it. libmpv2 and ffmpeg are for the tests.
      # --no-install-recommends leaves out yt-dlp, which libmpv2 recommends.
      #
      # apt has no wall-clock bound of its own: its timeout is an inactivity
      # timer that every arriving byte resets, so a mirror that accepts the
      # connection and then goes quiet holds it open indefinitely. The
      # runners' mirrors do this (actions/runner-images#15040: `apt-get
      # update` silent for over a quarter of an hour), so the bound comes from
      # outside apt.
      - name: libmpv, ffmpeg and fontconfig (Linux)
        if: runner.os == 'Linux'
        # Backstop above the loop's worst case, so its own message is what
        # fails rather than a bare step timeout.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          opts=(
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
            -o Acquire::Languages=none
          )
          attempts=2
          for attempt in $(seq 1 $attempts); do
            rc=0
            # `sudo timeout`, not `timeout sudo`: the kill has to reach
            # apt-get, or it orphans one still holding the lists lock. The
            # variable goes inside sudo because sudoers resets the environment.
            sudo DEBIAN_FRONTEND=noninteractive timeout --kill-after=15s 180s \
              apt-get "${opts[@]}" update || rc=$?
            # A failed update usually means the install would 404 on a stale
            # index, but on the last attempt try anyway: the image ships
            # lists, and these packages come from the release pocket.
            if [ "$rc" -eq 0 ] || [ "$attempt" -eq "$attempts" ]; then
              rc=0
              sudo DEBIAN_FRONTEND=noninteractive timeout --kill-after=15s 300s \
                apt-get "${opts[@]}" install -y --no-install-recommends \
                libfontconfig-dev libmpv2 ffmpeg || rc=$?
              if [ "$rc" -ne 0 ]; then
                sudo DEBIAN_FRONTEND=noninteractive timeout --kill-after=10s 60s \
                  dpkg --configure -a || true
              fi
            fi
            if [ "$rc" -eq 0 ]; then
              dpkg-query -W libmpv2 ffmpeg libfontconfig-dev
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed with $rc (124 = timed out, 137 = had to be killed)"
            if [ "$attempt" -lt "$attempts" ]; then
              sleep 5
            fi
          done
          echo "::error::apt failed twice; see the warnings above"
          exit 1

      # One formula gives both: mpv depends on ffmpeg, whose Homebrew build
      # includes libx264. Patina's loader finds /opt/homebrew/lib/libmpv.2.dylib
      # by itself, which is the point: nothing here tells it where to look.
      # The image already turns Homebrew's auto-update off; the variables say
      # so where it matters rather than relying on the image.
      - name: libmpv and ffmpeg (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          brew install mpv || { sleep 30; brew install mpv; }
          brew list --versions mpv ffmpeg
          ls -l "$(brew --prefix)/lib/libmpv.2.dylib"
          command -v ffmpeg

      # Windows has no package of libmpv, so the job downloads it, pinned by
      # digest in packaging/windows-deps.env, which the steps below also read.
      # The downloads are cached by the pins, so a bump downloads afresh and
      # an unchanged pin survives its asset being deleted upstream.
      - name: Windows dependency pins
        if: runner.os == 'Windows'
        shell: bash
        # The checkout has CRLF line endings on Windows.
        run: grep -E '^[A-Z0-9_]+=' packaging/windows-deps.env | tr -d '\r' >> "$GITHUB_ENV"

      - name: Restore the Windows downloads
        if: runner.os == 'Windows'
        id: downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/downloads
          key: windows-downloads-${{ hashFiles('packaging/windows-deps.env') }}

      - name: Download libmpv, vulkan-1.dll and ffmpeg (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: ./packaging/windows-deps.ps1 -Downloads (Join-Path $env:RUNNER_TEMP 'downloads')

      # The digest proves these are the bytes that were pinned; this proves
      # they came from zhongfly's own workflow on a GitHub-hosted runner. It
      # matters when the pin moves, which is when the cache misses.
      - name: Check libmpv's build provenance (Windows)
        if: runner.os == 'Windows' && steps.downloads.outputs.cache-hit != 'true'
        timeout-minutes: 5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $file = Join-Path $env:RUNNER_TEMP ('downloads\' + [IO.Path]::GetFileName($env:WIN_LIBMPV_URL))
          gh attestation verify $file --repo zhongfly/mpv-winbuild `
            --signer-workflow zhongfly/mpv-winbuild/.github/workflows/mpv.yml `
            --deny-self-hosted-runners
          if ($LASTEXITCODE -ne 0) { throw "libmpv's attestation did not verify" }

      # Saved straight away, not at the end of the job, so a red test run
      # still keeps the downloads. Only from master, whose cache every branch
      # and pull request can restore.
      - name: Save the Windows downloads
        if: runner.os == 'Windows' && github.ref == 'refs/heads/master' && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}

      # PATINA_LIBMPV names the DLL, since the test binary runs from
      # target\debug\deps, where nothing is beside it. Its directory also goes
      # on PATH for vulkan-1.dll: Windows looks for a DLL's own imports along
      # the normal search path, not in the directory it was loaded from.
      - name: Install libmpv and ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $lib = Join-Path $env:RUNNER_TEMP 'libmpv'
          $bin = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          ./packaging/windows-deps.ps1 -Downloads (Join-Path $env:RUNNER_TEMP 'downloads') -Lib $lib -Ffmpeg $bin
          Add-Content -Path $env:GITHUB_ENV -Value "PATINA_LIBMPV=$(Join-Path $lib 'libmpv-2.dll')"
          Add-Content -Path $env:GITHUB_PATH -Value $lib
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      # Restored under its exact key or not at all. Falling back on an older
      # entry and saving the two together grows target/ by every dependency
      # that moved, and one run's entries can then pass the repository's
      # 10 GB. So a miss builds from nothing: on master once per compiler,
      # per change to Cargo.lock or the manifest, and per change to the `env`
      # above that alters the build, which the key names. Bump the v1 when
      # this file changes the build some other way. A pull request that
      # moves any of these builds cold on every push, since only master
      # saves.
      - name: Restore the build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-v1-${{ steps.toolchain.outputs.rustc }}-incremental${{ env.CARGO_INCREMENTAL }}-debug-${{ env.CARGO_PROFILE_DEV_DEBUG }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}

      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      # Warnings are errors because the tree is at zero, and that only stays
      # true if letting one through fails the build. Run on every platform:
      # each one compiles code behind its own cfg that no other job sees.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # A real link of the binary: clippy never links, and `cargo test` builds
      # only the test harness, which on Linux doesn't even link fontconfig.
      - name: Build
        id: build
        run: cargo build --locked

      # .cargo/config.toml links the C runtime in; this checks the exe that
      # was built, on the debug build here as bundle.yml does on the one it
      # packs.
      - name: No Visual C++ runtime imports
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows-imports.ps1 target/debug/patina.exe

      - name: Test
        run: cargo test --locked

      # Only from master, and only when the restore missed: on a hit the entry
      # is already what this job would save. Kept when the tests fail, since
      # the build they ran on is sound, so fixing them doesn't mean a cold
      # build each time.
      - name: Save the build cache
        if: >-
          !cancelled() && steps.build.outcome == 'success'
          && github.ref == 'refs/heads/master' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
