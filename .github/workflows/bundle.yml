# Self-contained builds of Patina for macOS and Windows, carrying their own
# libmpv, as workflow artifacts: a universal Patina.app and a Windows folder
# with patina.exe and the DLLs it needs. Nothing is published or signed
# beyond ad hoc; these are for running Patina on machines that have never
# had a build tool or mpv near them.
#
# Run by hand with the full SHA of a pushed commit:
#   gh workflow run bundle.yml --repo jzbz/patina --ref master -f ref=<sha>
name: bundle

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to build (a full SHA)
        required: true

# Read-only, as in ci.yml: the build runs every dependency's build script,
# and nothing here needs to write.
permissions:
  contents: read

# Asking again for the same commit replaces the run already going.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  macos:
    name: macOS (universal)
    # arm64, building the x86_64 half by cross-compiling, which Apple's
    # toolchain does natively.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Toolchain
        id: toolchain
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustup target add x86_64-apple-darwin
          rustc -Vv
          v=$(rustc -V | tr -cs '[:alnum:].' '-')
          echo "rustc=${v%-}" >> "$GITHUB_OUTPUT"

      # IINA's libmpv and its libraries, pinned by digest in
      # packaging/macos-libmpv.txt and cached by that file, so an unchanged
      # pin survives IINA replacing the files upstream.
      - name: Restore the libraries
        id: libraries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/macos-libmpv
          key: macos-libmpv-${{ hashFiles('packaging/macos-libmpv.txt') }}

      - name: Download the libraries
        timeout-minutes: 10
        run: packaging/macos-libmpv.sh "$RUNNER_TEMP/macos-libmpv"

      - name: Save the libraries
        if: github.ref == 'refs/heads/master' && steps.libraries.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/macos-libmpv
          key: ${{ steps.libraries.outputs.cache-primary-key }}

      # As in ci.yml: restored under its exact key or not at all.
      - name: Restore the build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: bundle-${{ runner.os }}-${{ runner.arch }}-v1-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}

      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Save the build cache
        if: >-
          !cancelled() && github.ref == 'refs/heads/master' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Bundle
        run: packaging/macos-bundle.sh "$RUNNER_TEMP/macos-libmpv"

      # The bundle on its own: both halves of the binary, nothing outside
      # it linked but the system, and its libmpv starting a core from
      # Contents/Frameworks. (The runner is arm64; the x86_64 half runs on
      # the test Mac.)
      - name: Check the bundle
        run: |
          set -euo pipefail
          app=dist/Patina.app
          lipo -archs "$app/Contents/MacOS/patina"
          for arch in arm64 x86_64; do
            lipo "$app/Contents/MacOS/patina" -verify_arch "$arch"
          done
          if otool -L "$app/Contents/MacOS/patina" "$app"/Contents/Frameworks/*.dylib \
              | grep -E '^\s+/' | grep -vE '^\s+/(System|usr/lib)/'; then
            echo "::error::the bundle links libraries from outside it"
            exit 1
          fi
          out=$("$app/Contents/MacOS/patina" --version)
          echo "$out"
          grep -q "Patina.app/Contents/MacOS/../Frameworks/libmpv.2.dylib" <<< "$out" || {
            echo "::error::Patina did not load the bundled libmpv"
            exit 1
          }

      - name: Zip
        id: zip
        run: |
          set -euo pipefail
          name="patina-$(git rev-parse --short=12 HEAD)-macos-universal.zip"
          ditto -c -k --keepParent dist/Patina.app "$name"
          shasum -a 256 "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-universal
          path: ${{ steps.zip.outputs.name }}
          if-no-files-found: error

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Toolchain
        id: toolchain
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustc -Vv
          v=$(rustc -V | tr -cs '[:alnum:].' '-')
          echo "rustc=${v%-}" >> "$GITHUB_OUTPUT"

      # The same pins and the same cache as ci.yml, which keeps them warm.
      - name: Windows dependency pins
        shell: bash
        # The checkout has CRLF line endings on Windows.
        run: grep -E '^[A-Z0-9_]+=' packaging/windows-deps.env | tr -d '\r' >> "$GITHUB_ENV"

      - name: Restore the Windows downloads
        id: downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/downloads
          key: windows-downloads-${{ hashFiles('packaging/windows-deps.env') }}

      - name: Download libmpv and vulkan-1.dll
        timeout-minutes: 10
        shell: pwsh
        run: ./packaging/windows-deps.ps1 -Downloads (Join-Path $env:RUNNER_TEMP 'downloads')

      - name: Check libmpv's build provenance
        if: steps.downloads.outputs.cache-hit != 'true'
        timeout-minutes: 5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $file = Join-Path $env:RUNNER_TEMP ('downloads\' + [IO.Path]::GetFileName($env:WIN_LIBMPV_URL))
          gh attestation verify $file --repo zhongfly/mpv-winbuild `
            --signer-workflow zhongfly/mpv-winbuild/.github/workflows/mpv.yml `
            --deny-self-hosted-runners
          if ($LASTEXITCODE -ne 0) { throw "libmpv's attestation did not verify" }

      - name: Restore the build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: bundle-${{ runner.os }}-${{ runner.arch }}-v1-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}

      - name: Build
        run: cargo build --release --locked

      - name: Save the build cache
        if: >-
          !cancelled() && github.ref == 'refs/heads/master' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: No Visual C++ runtime imports
        shell: pwsh
        run: ./packaging/windows-imports.ps1 target/release/patina.exe

      # patina.exe with libmpv-2.dll beside it, where Patina looks first, and
      # the vulkan-1.dll libmpv imports, which Windows finds in the exe's
      # folder.
      - name: Bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'dist\Patina'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target\release\patina.exe $dir
          ./packaging/windows-deps.ps1 -Downloads (Join-Path $env:RUNNER_TEMP 'downloads') -Lib $dir
          Copy-Item LICENSE (Join-Path $dir 'LICENSE.txt')
          Copy-Item ui\icons\LICENSE (Join-Path $dir 'LICENSE-lucide.txt')
          Copy-Item packaging\THIRD-PARTY.md (Join-Path $dir 'THIRD-PARTY.md')
          Get-ChildItem $dir | Select-Object Name, Length

      # Run from the folder with nothing else on PATH that could stand in for
      # its DLLs. A GUI-subsystem exe has no console, but it does write to
      # the handles it is given.
      - name: Check the bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'version.txt'
          $p = Start-Process -FilePath dist\Patina\patina.exe -ArgumentList '--version' `
            -RedirectStandardOutput $out -NoNewWindow -PassThru
          if (-not $p.WaitForExit(60000)) { throw 'patina --version was still running after a minute' }
          $text = Get-Content -Raw -LiteralPath $out
          $text
          if ($p.ExitCode -ne 0) { throw ('patina --version exited 0x{0:X8}' -f $p.ExitCode) }
          if ($text -notmatch 'Patina\\libmpv-2\.dll') { throw 'Patina did not load the bundled libmpv-2.dll' }

      - name: Zip
        id: zip
        shell: pwsh
        run: |
          $sha = (git rev-parse --short=12 HEAD).Trim()
          $name = "patina-$sha-windows-x86_64.zip"
          Compress-Archive -Path dist\Patina -DestinationPath $name
          (Get-FileHash -Algorithm SHA256 $name).Hash
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "name=$name"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x86_64
          path: ${{ steps.zip.outputs.name }}
          if-no-files-found: error
