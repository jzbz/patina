<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    Lucide's `play` (lucide-static v1.61.0, ISC; see LICENSE in this folder),
    filled, on a ground of verdigris: the green that copper turns as it
    oxidizes, which is what a patina is. Drawn the way Azzurro's icon is: a
    diagonal ramp with a soft sheen, on Flathub's icon grid.

    The glyph is placed by transform, so its path stays a verbatim copy of
    Lucide's. Filled, it is drawn smaller than a line glyph would be (6 pixels
    per Lucide unit rather than 7) so that it carries the same weight in its
    tile; Lucide's 2px stroke, scaled with it, rounds the corners.
  -->
  <defs>
    <!--
      Pale verdigris at the top left, the patina green through the middle,
      a deep copper green in the far corner. Deep, but not dark: the far
      corner is where the tile meets whatever it sits on, and #1f7a68 is
      3:1 against libadwaita's dark window background (#222226), where the
      #22574f this used to end in was under 2:1 and the corner all but
      vanished. White on it is better than 5:1.
    -->
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd1b9"/>
      <stop offset="0.45" stop-color="#2aa889"/>
      <stop offset="1" stop-color="#1f7a68"/>
    </linearGradient>

    <!-- A soft highlight where the light would fall, for a little depth. -->
    <radialGradient id="sheen" cx="0.28" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 208 of the 256, from 24 to 232: the square on Flathub's icon grid. -->
  <rect x="24" y="24" width="208" height="208" rx="48" fill="url(#ground)"/>
  <rect x="24" y="24" width="208" height="208" rx="48" fill="url(#sheen)"/>

  <g transform="translate(56 56) scale(6)"
     fill="#ffffff" stroke="#ffffff" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/>
  </g>
</svg>
