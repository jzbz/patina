[package]
name = "patina"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A media player for Linux, macOS and Windows, powered by mpv, with Jellyfin and YouTube clients"
license = "MIT"
homepage = "https://patina.video/"
repository = "https://github.com/jzbz/patina"
build = "build.rs"

[dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
async-channel = "2.5.0"
blurhash = "0.2.3"
csv = "1.4.0"
csv-core = "0.1.13"
ctrlc = { version = "3.5.2", features = ["termination"] }
directories = "6.0.0"
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
getrandom = "0.4.3"
glow = "0.18.0"
# What has the keyboard's focus, which Slint has no public way to ask (see
# keep_keyboard in src/window.rs). At Slint's exact version (see src/backend.rs).
i-slint-core = { version = "=1.18.1", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
jiff = "0.2.43"
keyring-core = "1.0.1"
libloading = "0.9.0"
log = "0.4.35"
raw-window-handle = "0.6.2"
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "unstable-fontique-011",
    "unstable-winit-030",
] }
trash = "5.3.0"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "platform-verifier", "socks-proxy"] }
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
i-slint-backend-winit = "=1.18.1"
smithay-clipboard = "0.7.3"
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
zbus = { version = "6.2.1", default-features = false, features = ["default-rt", "service"] }
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Media", "Foundation", "Win32_Foundation", "Win32_System_WinRT"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSView", "NSControl", "NSButton", "NSWindow"] }
objc2-foundation = "0.3.2"
objc2-media-player = "0.3.2"

[dev-dependencies]
# Slint's testing backend, for the tests that put a window through key
# presses. At Slint's exact version, as i_slint_core is (see src/backend.rs).
i-slint-backend-testing = "=1.18.1"

[build-dependencies]
slint-build = "1.18.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
