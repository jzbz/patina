[package]
name = "patina"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A modern media player for Linux, macOS and Windows, powered by mpv"
license = "MIT"
homepage = "https://patina.video/"
repository = "https://github.com/jzbz/patina"
build = "build.rs"

[dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
async-channel = "2.5.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
directories = "6.0.0"
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
glow = "0.18.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
jiff = "0.2.38"
keyring-core = "1.0.1"
libloading = "0.9.0"
log = "0.4.34"
raw-window-handle = "0.6.2"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "unstable-winit-030",
] }
trash = "5.2.9"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "6.1.0", default-features = false, features = ["default-rt", "service"] }
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Media", "Foundation", "Win32_Foundation", "Win32_System_WinRT"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Power"] }
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSControl", "NSButton", "NSWindow"] }
objc2-foundation = "0.3.2"
objc2-media-player = "0.3.2"

[build-dependencies]
slint-build = "1.18.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
