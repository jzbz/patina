[package]
name = "patina"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A modern media player for Linux, macOS and Windows, powered by mpv"
license = "MIT"
repository = "https://github.com/jzbz/patina"
build = "build.rs"

[dependencies]
async-channel = "2.5.0"
directories = "6.0.0"
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
glow = "0.18.0"
libloading = "0.9.0"
log = "0.4.34"
raw-window-handle = "0.6.2"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-femtovg",
    "unstable-winit-030",
] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Power"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
