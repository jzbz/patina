# cargo-about's configuration for packaging/THIRD-PARTY-rust.txt, the
# licences of the Rust crates compiled into patina. packaging/rust-licenses.sh
# runs it with packaging/about.hbs; its header says when and how.

# The licences Patina accepts a crate under, most preferred first. Where a
# crate offers a choice ("MIT OR Apache-2.0"), the first of these it offers is
# the one the notice names and gives the text of. MIT comes first because most
# crates' own copy of it carries their copyright line, where Apache-2.0's
# text carries none. A crate whose licence is not on this list, here or in
# its own section below, fails the script: a new licence is a decision to
# make, not something to pass on unread.
accepted = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    # Slint is under the GPL 3.0, its royalty-free licence or its commercial
    # one, and Patina takes the royalty-free licence (README.md, under
    # License). cargo-about 0.9.3 can't attach a licence of this kind to the
    # text each Slint crate ships in LICENSES/, even when told where it is:
    # it warns that the licence has no file and leaves it out. So the
    # template names the Slint crates by their licence expression, and
    # packaging/rust-licenses.sh adds the text from Slint's own crate.
    "LicenseRef-Slint-Royalty-free-2.0",
]

# Every platform a package is built for: the Flatpak's two architectures,
# both halves of the universal Patina.app, and the Windows folder. A crate
# that only some of them compile is in the one file all three packages carry.
# cargo-about judges a dependency's cfg against all of them at once, so a few
# crates that no single target builds are named as well (windows_x86_64_gnu,
# say, whose cfg asks for x86_64 and the GNU environment, which x86_64 Linux
# has): one licence too many, never one too few.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Build scripts' dependencies and slint-build run on the build machine and
# none of their code ends up in patina, nor does anything only the tests use.
# Proc macros stay in, since cargo counts them as normal dependencies: their
# code isn't in the binary either, but the code they generate is.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Crate by crate, from here to the end of the file, as cargo-about requires.
#
# Two licences only one crate each uses, accepted for that crate alone.
# webpki-roots is Mozilla's list of root certificates, the data rustls checks
# a server against. option-ext is under the MPL 2.0, whose section 3.2 asks
# that whoever receives the program be told where its source is: the notice
# gives each crate's repository, and the crate is on crates.io unmodified.
[webpki-roots]
accepted = ["CDLA-Permissive-2.0"]

[option-ext]
accepted = ["MPL-2.0"]

# Crates that ship their licence texts in a form cargo-about doesn't
# recognise, pointed at them so the notice carries the crate's own copy, with
# its copyright line, rather than the licence's standard text. Each checksum
# is the SHA-256 of the file (sha256sum), or of the part from `start` to the
# end of `end`, both included, where only part of a file is the licence.
#
# windows-rs indents its MIT text by four spaces, which defeats the match.
# The crates share one copy of it, and versions so far share it too.
[windows]
clarify.license = "MIT OR Apache-2.0"
clarify.files = [{ path = "license-mit", license = "MIT", checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383" }]

[windows-collections]
clarify.license = "MIT OR Apache-2.0"
clarify.files = [{ path = "license-mit", license = "MIT", checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383" }]

