# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json

# Written by hand to the checklist in packaging/winget/README.md, and to be
# kept in sync with what is actually submitted, so the next release starts
# from the real thing rather than from a draft. Nothing has been submitted
# yet: two values below are placeholders, filled in once the release is
# published and its SHA256SUMS signed.
#
# InstallerType inno: the per-user Inno Setup installer release.yml builds
# around the portable folder (packaging/windows/). It never asks for
# administrator rights, so Scope is user and there is no ElevationRequirement.
# ProductCode is the installer's AppId with the _is1 Inno adds, which is how
# winget recognizes the installed copy. Commands only helps search here: the
# installer registers an App Paths entry for patina.exe, not a winget alias.
# Patina starts with the installer, so there is no portable entry to move
# anyone off.
PackageIdentifier: Patina.Patina
PackageVersion: 0.1.0
InstallerType: inno
Scope: user
UpgradeBehavior: install
Commands:
- patina
# Metadata only: winget registers nothing for these, and neither does the
# installer. Patina registers its file types and patina:// links itself, from
# Preferences > Utilities. The extensions are the first column of
# packaging/media-types.tsv, in its order, and change when it does.
Protocols:
- patina
FileExtensions:
- 3g2
- 3gp
- asf
- avi
- divx
- dv
- f4v
- flv
- h264
- hevc
- m2ts
- m2v
- m4v
- mk3d
- mkv
- mov
- mp4
- mpeg
- mpg
- mts
- mxf
- ogm
- ogv
- qt
- rm
- rmvb
- ts
- vob
- webm
- wmv
- wtv
- y4m
- aac
- ac3
- aif
- aiff
- ape
- caf
- dff
- dsf
- dts
- eac3
- flac
- m4a
- m4b
- mka
- mp2
- mp3
- mpc
- oga
- ogg
- opus
- ra
- tak
- tta
- wav
- weba
- wma
- wv
- cue
- m3u
- m3u8
- pls
ProductCode: Patina.Patina_is1
# The day the release is published. A placeholder until then, and not a
# date, so winget validate refuses the manifest until it is filled in.
ReleaseDate: YYYY-MM-DD
Installers:
- Architecture: x64
  InstallerUrl: https://github.com/jzbz/patina/releases/download/v0.1.0/patina-v0.1.0-x86_64-setup.exe
  # Taken from the release's PGP-signed SHA256SUMS rather than computed here,
  # so the hash winget pins is the one covered by that signature. A
  # placeholder until the release is signed, and not a hash, so winget
  # validate refuses the manifest until it is filled in.
  InstallerSha256: FROM-THE-SIGNED-SHA256SUMS
ManifestType: installer
ManifestVersion: 1.12.0
