ShortDescription: A media player built on mpv that follows IINA's design
Description: A media player for Linux, macOS and Windows, written in Rust with a Slint interface on top of mpv. It follows IINA's design and behaviour, and its goal is feature parity with IINA on all three platforms. Patina is at an early stage. Playback, the IINA-style window and controls, the sidebars, menus, key bindings and history work today; much of IINA is still to come.
